  - heading "14. Twenty questions, one line each" [level=2] [ref=e210]
  - list [ref=e211]:
    - listitem [ref=e212]: What does kubelet do? Runs the pods the API server assigns to its node, runs probes, reports status. Decides nothing.
    - listitem [ref=e213]: What places a pod on a node? kube-scheduler, by requests plus nodeSelector/affinity/taints.
    - listitem [ref=e214]: What keeps 4 runners alive? The ReplicaSet behind the Deployment.
    - listitem [ref=e215]: How does the controller know a runner is idle? Pod Ready (probe 200) and not in its assigned set.
    - listitem [ref=e216]:
      - text: Why delete the pod instead of exiting?
      - code [ref=e217]: "restartPolicy: Always"
      - text: restarts in place with the dirty workdir.
    - listitem [ref=e218]: How does the controller reach a runner? Pod IP from the API, HTTP to :8080. Pods have real VPC IPs.
    - listitem [ref=e219]:
      - text: How does the runner reach the controller? Service DNS
      - code [ref=e220]: controller
      - text: ", ClusterIP, kube-proxy, the pod."
    - listitem [ref=e221]: Why no LoadBalancer Service? Nothing in the cluster is public; the webhook goes to API Gateway, Lambda, SQS, and the controller pulls.
    - listitem [ref=e222]: What stops a runner from reading Postgres or EC2 metadata? NetworkPolicy, enforced by the VPC CNI eBPF agent. Verified.
    - listitem [ref=e223]: What is the hole in it? Any host on 443.
    - listitem [ref=e224]: How does the controller get AWS credentials? Pod Identity association to an IAM role, via the node agent.
    - listitem [ref=e225]: "How does it get Kubernetes permissions? ServiceAccount plus Role (pods: get/list/watch/delete) in one namespace."
    - listitem [ref=e226]: How does kubectl from the driver box authenticate? IAM role, EKS access entry, cluster-admin.
    - listitem [ref=e227]: What is a PVC? A claim for storage; the EBS CSI driver turns it into an AZ-bound EBS volume.
    - listitem [ref=e228]: What does Karpenter react to? Pending pods. It picks the cheapest instance that fits them and consolidates idle nodes after 60s.
    - listitem [ref=e229]: What happens on a spot reclaim mid-task? Interruption queue, drain, pod vanishes, controller requeues immediately.
    - listitem [ref=e230]: KEDA vs Karpenter? KEDA scales pods/Jobs from external metrics; Karpenter scales nodes. We kept KEDA only as the cold-start baseline.
    - listitem [ref=e231]: What is a CRD? A new object type; its operator is the controller loop that acts on it (NodePool, ScaledJob, ServiceMonitor).
    - listitem [ref=e232]:
      - text: What does Helm do? Templates YAML and records the release.
      - code [ref=e233]: helm template
      - text: shows what it applies.
    - listitem [ref=e234]:
      - text: If the controller dies mid-review? The SQS message was already deleted; the row is in Postgres;
      - code [ref=e235]: reconcile()
      - text: "on boot resumes reviewing tasks and requeues running ones. Measured: 17 reviews resumed."