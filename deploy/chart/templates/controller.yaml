{{- if .Values.controller.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
subjects:
  - kind: ServiceAccount
    name: controller
roleRef:
  kind: Role
  name: controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  labels: { app: controller }
spec:
  selector: { app: controller }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: controller }
  template:
    metadata:
      labels: { app: controller }
    spec:
      serviceAccountName: controller
      # Stateful / control-plane pods stay on the fixed node group; only runners may land on Karpenter burst nodes.
      nodeSelector:
        pr-runtime/pool: general
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: {{ .Values.image.registry }}/controller:{{ .Values.image.controllerTag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: QUEUE_URL
              value: {{ .Values.controller.queueUrl | quote }}
            - name: REPO
              value: {{ .Values.controller.repo | quote }}
            - name: ADMISSION_CAP
              value: {{ .Values.controller.admissionCap | quote }}
            - name: TASK_DEADLINE_SECONDS
              value: {{ .Values.controller.taskDeadlineSeconds | quote }}
            - name: REVIEWER_MODEL
              value: {{ .Values.controller.reviewerModel | quote }}
            - name: JUDGE_MODEL
              value: {{ .Values.controller.judgeModel | quote }}
            - name: POOL_SIZE
              value: {{ .Values.runner.poolSize | quote }}
            - name: NODE_USD_PER_HOUR
              value: {{ .Values.controller.nodeUsdPerHour | default "0.0816" | quote }}
            - name: PRICE_INPUT_PER_M
              value: {{ .Values.controller.priceInputPerM | default "10.0" | quote }}
            - name: PRICE_OUTPUT_PER_M
              value: {{ .Values.controller.priceOutputPerM | default "50.0" | quote }}
            - name: REPOS
              value: {{ .Values.controller.repos | default "" | quote }}
            - name: MENTION_HANDLE
              value: {{ .Values.controller.mentionHandle | default "@pr-runtime" | quote }}
            - name: CHECKS_ENABLED
              value: {{ .Values.controller.checksEnabled | default "true" | quote }}
            - name: REVIEW_WORKERS
              value: {{ .Values.controller.reviewWorkers | default 32 | quote }}
            - name: REASONING_EFFORT
              value: {{ .Values.controller.reasoningEffort | default "high" | quote }}
            - name: POST_REVIEWS
              value: {{ .Values.controller.postReviews | quote }}
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}"
{{- if .Values.controller.secretsId }}
            # S9: secrets come from Secrets Manager via Pod Identity; no k8s Secret is mounted into the controller.
            - name: SECRETS_ID
              value: {{ .Values.controller.secretsId | quote }}
{{- else }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
{{- end }}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: eval-results
              mountPath: /eval-results
              readOnly: true
            - name: guidelines
              mountPath: /guidelines
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: eval-results
          configMap:
            name: eval-results
            optional: true
        - name: guidelines
          configMap:
            name: guidelines
            optional: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: controller
  labels: { app: controller }
spec:
  selector:
    matchLabels: { app: controller }
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
{{- end }}
