image:
  registry: 511572480852.dkr.ecr.us-east-1.amazonaws.com/pr-runtime
  controllerTag: dev
  runnerTag: dev

controller:
  enabled: true
  replicas: 1
  admissionCap: 0       # M: max runners busy at once. 0 = follow the pool (cap = Ready runner pods each tick); >0 = fixed override
  reviewWorkers: 32     # LLM-stage concurrency (I/O bound); separate from the runner cap
  taskDeadlineSeconds: 300
  reviewerModel: gpt-6-astra
  judgeModel: gpt-6-luna
  reasoningEffort: high
  secretsId: pr-runtime/app   # Secrets Manager secret id; empty = use the k8s Secret (.env) instead
  nodeUsdPerHour: "0.0816"   # m7g.large on-demand, us-east-1
  priceInputPerM: "10.0"     # gpt-6-astra standard tier
  priceOutputPerM: "50.0"
  repo: anthonyzhao27/flask
  repos: ""                       # comma-separated allowlist; empty = any repo the App is installed on
  mentionHandle: "@pr-runtime"
  checksEnabled: "true"
  queueUrl: https://sqs.us-east-1.amazonaws.com/511572480852/pr-runtime-tasks
  postReviews: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

runner:
  enabled: true
  poolSize: 4           # N: idle warm pods (the floor; with autoscale this is also minReplicaCount)
  autoscale:
    enabled: true       # KEDA ScaledObject on max(prr_tasks_pending): ~one pending task per runner, 4..16 replicas
    minReplicas: 4
    maxReplicas: 16
    pollingInterval: 5
    cooldownPeriod: 120
    prometheusUrl: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
    threshold: "1"
    scaleDownStabilizationSeconds: 120
  seedRepo: anthonyzhao27/flask   # baked into the image for the warm path; other repos clone on demand
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  workSizeLimit: 2Gi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 8Gi
  storageClass: gp3
  database: prruntime
  user: prruntime
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Secret is created out-of-band from .env by scripts/sync_secret.sh; the chart only references it.
secretName: pr-runtime-env

networkPolicy:
  enabled: true
