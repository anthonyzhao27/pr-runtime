image:
  registry: 511572480852.dkr.ecr.us-east-1.amazonaws.com/pr-runtime
  controllerTag: dev
  runnerTag: dev

controller:
  enabled: true
  replicas: 1
  admissionCap: 4       # M: max runners busy at once
  taskDeadlineSeconds: 300
  reviewerModel: gpt-6-astra
  judgeModel: gpt-6-luna
  reasoningEffort: high
  secretsId: pr-runtime/app   # Secrets Manager secret id; empty = use the k8s Secret (.env) instead
  nodeUsdPerHour: "0.0816"   # m7g.large on-demand, us-east-1
  priceInputPerM: "10.0"     # gpt-6-astra standard tier
  priceOutputPerM: "50.0"
  repo: anthonyzhao27/flask
  repos: anthonyzhao27/flask      # comma-separated allowlist of repos the App may review
  mentionHandle: "@pr-runtime"
  checksEnabled: "true"
  queueUrl: https://sqs.us-east-1.amazonaws.com/511572480852/pr-runtime-tasks
  postReviews: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

runner:
  enabled: true
  poolSize: 4           # N: idle warm pods
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  workSizeLimit: 2Gi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 8Gi
  storageClass: gp3
  database: prruntime
  user: prruntime
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Secret is created out-of-band from .env by scripts/sync_secret.sh; the chart only references it.
secretName: pr-runtime-env

networkPolicy:
  enabled: true
